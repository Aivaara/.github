<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aivaara origin and philosophy" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#6366F1" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="998" height="328" rx="12" fill="#0A0D14" stroke="#00F0FF" stroke-opacity="0.35"/>
  <rect x="1" y="1" width="998" height="328" rx="12" fill="url(#g)"/>
  <rect x="1" y="1" width="998" height="40" rx="12" fill="#030305"/>
  <rect x="1" y="28" width="998" height="13" fill="#030305"/>
  <circle cx="26" cy="21" r="5" fill="#6366F1"/>
  <circle cx="46" cy="21" r="5" fill="#6366F1" fill-opacity="0.6"/>
  <circle cx="66" cy="21" r="5" fill="#6366F1" fill-opacity="0.3"/>
  <text x="500" y="25" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8B93A7">aivaara@origin: ~</text>

  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="17">
    <text x="32" y="82" fill="#6366F1">$</text>
    <text x="52" y="82" fill="#E6EDF3">cat origin.txt</text>

    <text x="32" y="114" fill="#00F0FF" font-weight="700">Aivaara = AI + Vara</text>
    <text x="32" y="140" fill="#8B93A7">Vara, Sanskrit: excellent, supreme, the best.</text>
    <text x="32" y="166" fill="#8B93A7">Excellent technology, powered by intelligent engineering.</text>

    <text x="32" y="212" fill="#6366F1">$</text>
    <text x="52" y="212" fill="#E6EDF3">cat philosophy.txt</text>

    <text x="32" y="244" fill="#00F0FF">Build things that matter.</text>
    <text x="32" y="270" fill="#00F0FF">Create tools that empower.</text>
    <text x="32" y="296" fill="#00F0FF">Design experiences that inspire.</text>
    <rect x="370" y="282" width="10" height="18" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
