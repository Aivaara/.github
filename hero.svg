<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aivaara. Turn bold ideas into world class products." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030305"/>
      <stop offset="1" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366F1" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030305" stop-opacity="0"/>
      <stop offset="1" stop-color="#030305" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- scanning line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00F0FF" opacity="0.25">
    <animate attributeName="y" values="0;380;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- orbital system -->
  <g>
    <circle cx="930" cy="190" r="150" fill="url(#glow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g transform="rotate(-22 930 190)">
      <ellipse cx="930" cy="190" rx="240" ry="78" fill="none" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.2"/>
      <ellipse cx="930" cy="190" rx="170" ry="52" fill="none" stroke="#6366F1" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 6"/>
      <circle r="5" fill="#00F0FF">
        <animateMotion dur="11s" repeatCount="indefinite" path="M 690 190 a 240 78 0 1 1 480 0 a 240 78 0 1 1 -480 0"/>
      </circle>
      <circle r="4" fill="#6366F1">
        <animateMotion dur="7s" repeatCount="indefinite" path="M 760 190 a 170 52 0 1 0 340 0 a 170 52 0 1 0 -340 0"/>
      </circle>
    </g>
    <circle cx="930" cy="190" r="14" fill="#030305" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="930" cy="190" r="5" fill="#00F0FF">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M 930 20 V 360 M 760 190 H 1100" stroke="#00F0FF" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <rect x="0" y="0" width="1200" height="380" fill="url(#fade)" opacity="0"/>

  <!-- telemetry labels -->
  <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="11" fill="#00F0FF" fill-opacity="0.7">
    <text x="48" y="44">AIVAARA // ENGINEERING ORGANIZATION</text>
    <text x="1152" y="44" text-anchor="end">STATUS: ONLINE</text>
    <circle cx="1166" cy="40" r="3" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="352" fill="#6366F1" fill-opacity="0.9">LAT 19.0760 N  LON 72.8777 E  //  MUMBAI, IN</text>
    <text x="1152" y="352" text-anchor="end">aivaara.in</text>
  </g>

  <!-- wordmark -->
  <text x="48" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="10" fill="url(#title)">AIVAARA</text>
  <rect x="52" y="214" width="120" height="3" fill="#00F0FF">
    <animate attributeName="width" values="40;240;40" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="256" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="22" fill="#E6EDF3">Turn bold ideas into world class products.</text>
  <text x="50" y="288" font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="14" fill="#8B93A7">AI + Vara. Intelligent engineering, built to be excellent.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
